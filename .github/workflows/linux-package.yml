name: Package Desktop · Linux

# Builds the Ubuntu/Debian desktop package natively on hosted amd64 and arm64 runners, checks the
# bundled software against upstream and the dependency advisory database, verifies the package
# structure, installs it on the runner, launches it under Xvfb, and retains the .deb files as
# workflow artifacts. Linux packages publish through these artifacts; see
# apps/desktop/packaging/README.md#linux-actions-packaging.

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: 'Architectures to package: both hosted runners, or one of them'
        type: choice
        options: [both, amd64, arm64]
        default: both
        required: true
      version_mode:
        description: 'Version mode: default and auto number the build from the run; product keeps the checkout version; manual uses build_version'
        type: choice
        options: [default, product, auto, manual]
        default: default
        required: true
      build_version:
        description: 'Manual version: complete version for manual mode; must extend the checkout product version'
        type: string
        default: ''
        required: false
  push:
    tags: ['dsh-v*']

permissions:
  contents: read

concurrency:
  group: linux-desktop-package-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'
  PACKAGE_VERSION_MODE: ${{ github.event_name == 'push' && 'product' || inputs.version_mode }}
  PACKAGE_BUILD_VERSION: ${{ inputs.build_version }}
  PACKAGE_ARCHITECTURES: ${{ github.event_name == 'push' && 'both' || inputs.architectures }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Select the native runners for the requested architectures
        id: plan
        run: |
          set -euo pipefail
          case "$PACKAGE_ARCHITECTURES" in
            both) matrix='[{"arch":"x64","debian":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","debian":"arm64","runner":"ubuntu-24.04-arm"}]' ;;
            amd64) matrix='[{"arch":"x64","debian":"amd64","runner":"ubuntu-24.04"}]' ;;
            arm64) matrix='[{"arch":"arm64","debian":"arm64","runner":"ubuntu-24.04-arm"}]' ;;
            *) echo "::error::Unknown architecture selection '$PACKAGE_ARCHITECTURES'"; exit 1 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Best-practice gates that do not need a package: advisories against the production dependency
  # tree, and the bundled runtimes against their upstream release lines.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check production dependencies against the advisory database
        run: pnpm audit --prod --audit-level=high
      - name: Check bundled runtimes against their upstream release lines
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx apps/desktop/scripts/check-runtime-currency.ts
      - name: Check the Linux packaging workflow and scripts
        run: pnpm exec vitest run scripts/linux-package-workflow.spec.ts apps/desktop/tests/verify-linux-package.spec.ts apps/desktop/tests/check-runtime-currency.spec.ts apps/desktop/tests/smoke-linux-desktop.spec.ts

  package:
    needs: [plan, audit]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PACKAGE_ARCH: ${{ matrix.arch }}
      PACKAGE_DEBIAN_ARCH: ${{ matrix.debian }}
      DSH_DESKTOP_LINUX_MAINTAINER: ${{ vars.DSH_DESKTOP_LINUX_MAINTAINER }}
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          persist-credentials: false
          clean: true
      - name: Install Debian packaging, linting, and headless display tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils desktop-file-utils dpkg-dev lintian xvfb xz-utils
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Record the package maintainer from the repository variable
        run: |
          set -euo pipefail
          if [ -n "$DSH_DESKTOP_LINUX_MAINTAINER" ]; then
            printf 'DSH_DESKTOP_LINUX_MAINTAINER=%s\n' "$DSH_DESKTOP_LINUX_MAINTAINER" > apps/desktop/.env.linux
          fi
      - name: Resolve the build version
        id: settings
        run: node apps/desktop/scripts/prepare-linux-ci.mjs
      - name: Check packaging configuration and toolchain
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: pnpm run "package:desktop:linux:$PACKAGE_ARCH" --check --build-version "$PACKAGE_VERSION"
      - name: Build the package and verify its runtime and structure
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: pnpm run "package:desktop:linux:$PACKAGE_ARCH" --build-version "$PACKAGE_VERSION"
      - name: Locate the package
        id: artifact
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          set -euo pipefail
          directory="apps/desktop/.desktop-build/targets/linux-$PACKAGE_ARCH/artifacts"
          package="$directory/deepseek-harness-$PACKAGE_VERSION-linux-$PACKAGE_DEBIAN_ARCH.deb"
          test -f "$package"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/linux-package"
          cp "$package" "$RUNNER_TEMP/linux-package/"
          (cd "$RUNNER_TEMP/linux-package" && sha256sum -- *.deb > SHA256SUMS)
      - name: Lint the package with lintian
        env:
          PACKAGE: ${{ steps.artifact.outputs.package }}
        run: bash apps/desktop/scripts/lintian-linux-package.sh "$PACKAGE" "$RUNNER_TEMP/linux-package/lintian.txt"
      - name: Install the package with apt and check its system integration
        env:
          PACKAGE: ${{ steps.artifact.outputs.package }}
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "./$PACKAGE"
          dpkg -s deepseek-harness | sed -n '1,12p'
          test "$(readlink -f /usr/bin/deepseek-harness)" = "/opt/DeepSeek Harness/deepseek-harness"
          test -f /usr/share/applications/deepseek-harness.desktop
          stat -c '%a %U %n' "/opt/DeepSeek Harness/chrome-sandbox"
          desktop-file-validate /usr/share/applications/deepseek-harness.desktop
          "/opt/DeepSeek Harness/resources/runtime/cli/bin/dsh" --version
      - name: Launch the installed application under Xvfb
        run: node --import tsx apps/desktop/scripts/smoke-linux-desktop.ts --xvfb
      - name: Remove the package and check that nothing stays behind
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove -y deepseek-harness
          test ! -e /usr/bin/deepseek-harness
          test ! -e "/opt/DeepSeek Harness/deepseek-harness"
          test ! -e /usr/share/applications/deepseek-harness.desktop
      - name: Attest the package build origin
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v3.0.0
        with:
          subject-path: ${{ runner.temp }}/linux-package/*.deb
      - name: Retain packaging diagnostics
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-${{ matrix.debian }}-package-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain the verified package and its checksums
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-${{ matrix.debian }}-${{ steps.settings.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-package/*
          if-no-files-found: error
          retention-days: 14
